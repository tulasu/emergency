; Owner originates via traineebox ARI: originate ставит только call_id
; (call_id = attempt_calls.id = session_id = AudioSocket UUID).
; Outbound voice path is AudioSocket ONLY (no Stasis bridge — spec N):
; the first AudioSocket frame carries the UUID and dialog routes by it.
; Empty call_id (manual dial without vars) hangs up instead of bridging
; nowhere — dialog would close the connection anyway (AD-6).
[trainer-out]
; ARI originate всегда стартует на extension=s (см. ari.go + README).
; Шаблон _X. матчит цифры и пропускал s — Asterisk ронял канал сразу после
; ответа "sent to invalid extension but no invalid handler" (asterisk log).
exten = s,1,NoOp(outbound call ${call_id})
 same = n,GotoIf($["${call_id}" = ""]?hangup)
 same = n,GotoIf($["${DIALOG_ADDR}" != ""]?has_addr)
 same = n,Set(DIALOG_ADDR=dialog:9001)
 same = n(has_addr),AudioSocket(${call_id},${DIALOG_ADDR})
 same = n,Hangup()
 same = n(hangup),Hangup()

; входящие от регистрантов (для тестов руками): без call_id звонок
; висит на гудке, сессию не создаёт — dialog закрыл бы такой коннект (AD-6)
[trainer-in]
exten = s,1,NoOp(inbound call ${call_id})
 same = n,GotoIf($["${call_id}" = ""]?hangup)
 same = n,Answer()
 same = n,GotoIf($["${DIALOG_ADDR}" != ""]?has_addr)
 same = n,Set(DIALOG_ADDR=127.0.0.1:9001)
 same = n(has_addr),AudioSocket(${call_id},${DIALOG_ADDR})
 same = n,Hangup()
 same = n(hangup),Hangup()
