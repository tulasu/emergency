; PJSIP realtime connection for res_config_pgsql.so.
; Asterisk 20 andrius image reads this file via the module's own config
; handler (not sorcery/extconfig — those only map families). extconfig.conf
; still references the connection name «traineebox» via "pgsql,traineebox,*".
;
; Ключи: hostname/port/user/password (НЕ dbhost/dbport/dbuser/dbpassword) —
; иначе модуль не парсит секцию и падает на дефолты (dbname=asterisk, host="").
; localhost работает потому что asterisk запущен с network_mode: host и postgres
; проброшен на хост 5432:5432.

[general]
hostname = localhost
port = 5432
dbname = emergency
user = emergency
password = emergency
appname = asterisk

; Именованное соединение «traineebox» — extconfig.conf ссылается на него
; по имени. Без этой секции драйвер не находит коннект и эндпоинты не грузятся.
[traineebox]
hostname = localhost
port = 5432
dbname = emergency
user = emergency
password = emergency
appname = asterisk
