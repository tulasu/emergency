[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dialog"
dynamic = ["version"]
description = "Stateless snapshot executor over frozen dispatcher core"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0",
  "numpy>=1.26",
  "pymorphy3>=2.0",
  "razdel>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.version]
path = "../VERSION"
pattern = "(?P<version>\\S+)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
