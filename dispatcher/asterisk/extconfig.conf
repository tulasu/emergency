; PJSIP realtime: endpoints live in traineebox/Postgres (user_sip_endpoints).
; Asterisk reads ps_endpoints/ps_auths/ps_aors VIEWs directly — no reload
; on user create (endpoint registers → callable; enabled=false drops it).
[settings]
ps_endpoints => pgsql,traineebox,ps_endpoints
ps_auths => pgsql,traineebox,ps_auths
ps_aors => pgsql,traineebox,ps_aors
