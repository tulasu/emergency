; Шаг 3. Звонок по команде: originate ставит scenario_id/call_id,
; dialplan только отдаёт канал в Stasis — вся логика в Go/Python.
[trainer-out]
exten = _X.,1,NoOp(outbound to ${EXTEN} scenario ${scenario_id} call ${call_id})
 same = n,Stasis(trainer,${scenario_id},${call_id})
 same = n,Hangup()

; входящие от регистрантов (для тестов руками): та же Stasis-приложуха
[trainer-in]
exten = s,1,NoOp(inbound scenario ${scenario_id} call ${call_id})
 same = n,Stasis(trainer,${scenario_id},${call_id})
 same = n,Hangup()
