; Шаг 3. Регистрации регистрантов, только alaw (без транскодинга).
; Масштабирование — Kamailio впереди + ферма таких же боксов (шаг 7).

[transport-udp]
type = transport
protocol = udp
bind = 0.0.0.0:5060

[registrant](!)
type = endpoint
transport = transport-udp
context = trainer-out
disallow = all
allow = alaw
direct_media = no
force_rport = yes
rewrite_contact = yes

[registrant-auth](!)
type = auth
auth_type = userpass

[registrant-aor](!)
type = aor
max_contacts = 2
remove_existing = yes

