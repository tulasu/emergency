# Точечные разрешения там, где ни ключ, ни группа не различают смысл.
# Форма: <scenario_id>:<key>: <slot>
overrides:
  # Факт назван «запах газа», но это описание происшествия: ответ «В частном
  # доме пахнет газом», и спрашивают о нём «что случилось». В слоте «да/нет»
  # он засорял банк общими вопросами.
  "bilet30_call03:запах_газа": incident.what
  # То же самое: «Муж угрожает взорвать квартиру» — это суть вызова,
  # а не уточнение, чему угрожает опасность.
  "bilet29_call03:угроза": incident.what
  # «Она случайно выпила не те лекарства» — это то, что случилось, а не
  # уточнение препарата. Из-за неверного слота вопрос «что случилось?»
  # перебивал свой слот в ЛЮБОМ сценарии и уводил ответ в отказ.
  "bilet05_call02:лекарства": incident.what
  # «Вижу столб чёрного дыма» — суть вызова, а не описание дыма.
  "bilet16_call01:дым": incident.what
  # «Я нашёл бывшую жену, она лежит на полу» — суть вызова, а не признак
  # смерти вроде трупных пятен.
  "bilet25_call03:обнаружен_труп": incident.what
