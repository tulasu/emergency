# Онтология слотов: единица сведений, общая для всех сценариев.
#
# Формулировки вопросов принадлежат слоту, а не факту. Банк формулировок
# собирается компилятором из всех сценариев корпуса, поэтому поле `questions`
# здесь заполняется только для слотов, которых в корпусе ещё нет — затравка
# для новой ситуации от пользователя.
#
# aliases — имена ключей в сценариях. Форма `группа/ключ` точнее и побеждает
# форму `ключ`; для совсем неоднозначных случаев есть overrides внизу файла.
#
# kind:   value (записывается в карточку) | yesno | description
# family: используется слоем эллипсиса — «а корпус?» ищет в пределах семьи.

version: "0.1"

slots:

