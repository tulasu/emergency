# Шаг 7. Highload: ферма за балансировщиком. Один GPU = один python-воркер.
# Запуск: just up (из корня) поднимет и postgres+caddy, и этот стек.
# Override через .env / переменные окружения:
#   DISPATCHER_MODEL=e5-small-tuned   включить вектора
#   DISPATCHER_BACKEND=onnx           onnx (CPU) | torch (GPU)
#   DISPATCHER_DEVICE=cpu             cpu | cuda
#   DISPATCHER_ARBITER=laya           спорные реплики в Laya (без неё выключен)
#   DISPATCHER_ENSEMBLE=majority      голосование e5 + laya + LLM (сервис llama)
#   DISPATCHER_IMPROV=1               ответы вне сценария от LLM, живой Silero
# GPU: нужен NVIDIA Container Toolkit (docker run --gpus all ubuntu nvidia-smi).

services:
  asterisk:
    image: andrius/asterisk:20
    network_mode: host # RTP-тайминги не любят NAT докера
    volumes:
      - ./asterisk/pjsip.conf:/etc/asterisk/pjsip.conf:ro
      - ./asterisk/extensions.conf:/etc/asterisk/extensions.conf:ro
      # ARI для originate из оркестратора — без них HTTP-сервер выключен
      - ./asterisk/http.conf:/etc/asterisk/http.conf:ro
      - ./asterisk/ari.conf:/etc/asterisk/ari.conf:ro
    deploy:
      replicas: 1 # дальше: +Kamailio впереди, реплик K

  # llama-server для голоса LLM и ответов вне сценария (Qwen3-4B-Instruct)
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    network_mode: host
    volumes:
      - ./models/llama:/models:ro
    command:
      - -m
      - /models/${DISPATCHER_LLM:-Qwen3-4B-Instruct-2507-Q4_K_M.gguf}
      - -ngl
      - "99"
      - -c
      - "4096" # 2 слота по 2048: промпт голосования и импровизации влезает
      - -np
      - "2"
      - --host
      - 127.0.0.1
      - --port
      - "8081"
      - --no-webui
    healthcheck: # в образе проверка на 8080, а слушаем 8081
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8081/health"]
      interval: 10s
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  python:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    network_mode: host # один стек с traineebox/asterisk, проще DNS
    environment:
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      DISPATCHER_MODELS: /app/models
      # веса laya лежат в models/hub; задаём до любого импорта huggingface_hub —
      # setdefault в nlu/laya.py опаздывает, если transformers импортирован раньше
      HF_HOME: /app/models
      DISPATCHER_LLM_URL: http://127.0.0.1:8081
      GIGAAM_MODEL_PATH: /app/models/gigaam-v2-ctc
      DISPATCHER_MODEL: ${DISPATCHER_MODEL:-}
      DISPATCHER_BACKEND: ${DISPATCHER_BACKEND:-}
      DISPATCHER_DEVICE: ${DISPATCHER_DEVICE:-}
      DISPATCHER_ARBITER: ${DISPATCHER_ARBITER:-}
      DISPATCHER_STT: ${DISPATCHER_STT:-}
      DISPATCHER_ENSEMBLE: ${DISPATCHER_ENSEMBLE:-}
      DISPATCHER_IMPROV: ${DISPATCHER_IMPROV:-}
    volumes:
      - ./models:/app/models:ro
      - ${HOME}/.cache/torch/hub:/root/.cache/torch/hub:ro # Silero для живых ответов
      - ./data/ontology:/app/data/ontology:ro
      - ./data/scenarios:/app/data/scenarios:ro
      - ./data/gold:/app/data/gold:ro
      - ./data/blind:/app/data/blind:ro
      - ./data/audio:/app/data/audio # предрендер шага 2 — запись
      - ./data/calls:/app/data/calls # лог фраз оператора (wav + turns.jsonl)
    depends_on:
      - llama
    deploy:
      replicas: 1 # M = звонки / ~50-100 сессий на GPU, уточнить нагрузочным
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]


  # Owner-executor stack (traineebox owns, dialog/ticketgen execute).
  # URL linkage over host network: ARI (asterisk) <- traineebox ->
  # dialog (voice) + ticketgen (drafts). asterisk boots first.
  dialog:
    build:
      context: ..
      dockerfile: dialog/Dockerfile
    network_mode: host # AudioSocket :9001 + HTTP :8000 next to asterisk
    environment:
      DIALOG_PORT: ${DIALOG_PORT:-8000}
      TRAINEEBOX_URL: http://127.0.0.1:8080
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ./data/ontology:/app/data/ontology:ro
      - dialog-wav:/tmp/dialog-wav # wav stays on dialog volume (no upload)
    depends_on:
      - asterisk

  ticketgen:
    build:
      context: ..
      dockerfile: ticketgen/Dockerfile
    network_mode: host # pure function over HTTP POST /draft, no DB
    environment:
      TICKETGEN_PORT: ${TICKETGEN_PORT:-8001}
      TICKETGEN_CATALOG_PATH: /catalog
      DIALOG_URL: http://127.0.0.1:8000
    volumes:
      - ../artifacts/etc/traineebox/catalog:/catalog:ro
    depends_on:
      - asterisk

  traineebox:
    build:
      context: ..
      dockerfile: traineebox/Dockerfile
    network_mode: host # single stack with asterisk/dialog, plain DNS
    environment:
      TRAINEEBOX_HTTP_ADDR: ${TRAINEEBOX_HTTP_ADDR:-:8080}
      TRAINEEBOX_POSTGRES_DSN: ${TRAINEEBOX_POSTGRES_DSN:-}
      TRAINEEBOX_CATALOG_PATH: /catalog
      ARI_URL: http://127.0.0.1:8088/ari
      DIALOG_URL: http://127.0.0.1:8000
      TICKETGEN_URL: http://127.0.0.1:8001
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
    volumes:
      - ../artifacts/etc/traineebox/catalog:/catalog:ro
    depends_on:
      - asterisk
      - dialog
      - ticketgen

volumes:
  dialog-wav:
