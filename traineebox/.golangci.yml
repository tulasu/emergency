version: "2"

linters:
  default: none
  enable:
    - depguard
  settings:
    depguard:
      rules:
        platform:
          files:
            - "**/internal/platform/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/platform
            - github.com/jackc/pgx
            - github.com/jackc/pgx/v5
            - github.com/jackc/puddle
        auth_domain:
          files:
            - "**/internal/auth/domain/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/auth/domain
            - github.com/google/uuid
        auth_application:
          files:
            - "**/internal/auth/application/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/auth/domain
            - traineebox/internal/auth/application
            - github.com/google/uuid
            - golang.org/x/crypto
        auth_infrastructure:
          files:
            - "**/internal/auth/infrastructure/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/auth/domain
            - traineebox/internal/auth/infrastructure
            - traineebox/internal/platform/postgres
            - traineebox/internal/testkit
            - github.com/google/uuid
            - github.com/jackc/pgx
            - github.com/jackc/pgx/v5
            - github.com/jackc/puddle
        auth_presentation:
          files:
            - "**/internal/auth/presentation/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/auth/application
            - traineebox/internal/auth/domain
            - traineebox/internal/auth/presentation
            - traineebox/internal/testkit
            - github.com/danielgtaylor/huma
            - github.com/google/uuid
        groups_domain:
          files:
            - "**/internal/groups/domain/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/groups/domain
            - github.com/google/uuid
        groups_application:
          files:
            - "**/internal/groups/application/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/groups/domain
            - traineebox/internal/groups/application
            - github.com/google/uuid
        groups_infrastructure:
          files:
            - "**/internal/groups/infrastructure/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/groups/domain
            - traineebox/internal/groups/infrastructure
            - traineebox/internal/platform/postgres
            - traineebox/internal/testkit
            - github.com/google/uuid
            - github.com/jackc/pgx
            - github.com/jackc/pgx/v5
            - github.com/jackc/puddle
        groups_presentation:
          files:
            - "**/internal/groups/presentation/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/groups/application
            - traineebox/internal/groups/domain
            - traineebox/internal/groups/presentation
            - traineebox/internal/testkit
            - github.com/danielgtaylor/huma
            - github.com/google/uuid
        tickets_domain:
          files:
            - "**/internal/tickets/domain/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/tickets/domain
            - github.com/google/uuid
        tickets_application:
          files:
            - "**/internal/tickets/application/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/tickets/domain
            - traineebox/internal/tickets/application
            - github.com/google/uuid
        tickets_infrastructure:
          files:
            - "**/internal/tickets/infrastructure/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/tickets/domain
            - traineebox/internal/tickets/infrastructure
            - traineebox/internal/platform/postgres
            - traineebox/internal/testkit
            - github.com/google/uuid
            - github.com/jackc/pgx
            - github.com/jackc/pgx/v5
            - github.com/jackc/puddle
        tickets_presentation:
          files:
            - "**/internal/tickets/presentation/**/*.go"
          allow:
            - $gostd
            - traineebox/internal/tickets/application
            - traineebox/internal/tickets/domain
            - traineebox/internal/tickets/presentation
            - traineebox/internal/testkit
            - github.com/danielgtaylor/huma
            - github.com/google/uuid
