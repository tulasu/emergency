version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/auth/infrastructure/sql/queries.sql"
    schema: "internal/auth/infrastructure/sql/schema.sql"
    gen:
      go:
        package: "authsql"
        out: "internal/auth/infrastructure/authsql"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "pg_catalog.timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - column: "users.blocked_at"
            go_type:
              import: "time"
              type: "Time"
              pointer: true
