<div class="login">
  <form tbCard class="login__card" [formGroup]="form" (ngSubmit)="submit()">
    <header class="login__header">
      <h1 class="page-title page-title--login">Вход</h1>
      <p class="page-sub">Введите логин и пароль</p>
    </header>
    <div class="login__main">
      <div class="login__fields">
        <tb-field label="Логин">
          <tb-input formControlName="login" autocomplete="username" placeholder="Введите логин" />
        </tb-field>
        <tb-field label="Пароль">
          <tb-input
            formControlName="password"
            type="password"
            autocomplete="current-password"
            placeholder="Введите пароль"
          />
        </tb-field>
      </div>
      <div class="login__alert" [class.login__alert--on]="error()" [attr.aria-hidden]="error() ? null : true">
        <div class="login__alert-inner">
          <p class="login__error" aria-live="polite">{{ error() }}</p>
        </div>
      </div>
      <button tbButton width="block" type="submit" [busy]="pending()">Войти</button>
    </div>
  </form>
  <p class="login__copy">© {{ companyName }}, {{ year }}</p>
</div>
