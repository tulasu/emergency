<section class="page">
  <div class="sheet">
    <header class="sheet__header">
      <div class="sheet__titles">
        <h1 class="page-title">Импорт из файла</h1>
        <p class="page-sub">Учётные записи попадут в выбранную группу.</p>
      </div>
      <div class="sheet__actions">
        <tb-field class="sheet__group" label="Группа">
          <tb-select [formControl]="form.controls.group_id" placeholder="Выберите группу" [options]="groupOptions()" />
        </tb-field>
      </div>
    </header>

    <input
      #fileInput
      class="file-input"
      type="file"
      accept=".csv,.json,text/csv,application/json"
      (change)="onFile($event)"
    />

    @if (fileName()) {
      <div class="filebar">
        <div class="filebar__left">
          <tb-icon name="file" />
          <div class="filebar__text">
            <p class="filebar__name">{{ fileName() }}</p>
            <p class="filebar__meta">{{ fileMeta() }}</p>
          </div>
        </div>
        <button tbButton variant="ghost" type="button" (click)="fileInput.click()">Заменить файл</button>
      </div>
    }

    @if (error() && !fileName()) {
      <p class="sheet__error">{{ error() }}</p>
    }

    @if (fileName()) {
      <form [formGroup]="form" (ngSubmit)="submit()">
        <tb-users-table [users]="users" (add)="addRow()" (remove)="removeRow($event)" />
        <footer class="foot">
          <p>{{ countLabel() }}</p>
          @if (error()) {
            <p class="foot__error">{{ error() }}</p>
          }
          <button tbButton type="submit" [disabled]="pending()">Создать учётные записи</button>
        </footer>
      </form>
    }
  </div>
</section>
