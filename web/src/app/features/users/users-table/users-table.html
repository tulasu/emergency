<div class="table">
  <div class="table__scroll">
    <div class="table__head">
      <span>№</span>
      <span>ФИО</span>
      <span>Логин</span>
      <span></span>
    </div>
    @for (row of users().controls; track $index; let i = $index) {
      <div class="table__row" [formGroup]="rowGroup(i)">
        <span>{{ i + 1 }}</span>
        <tb-input formControlName="full_name" placeholder="ФИО" />
        <tb-input formControlName="login" placeholder="Логин" />
        <button type="button" class="table__del" (click)="remove.emit(i)" aria-label="Удалить строку">
          <tb-icon name="x" />
        </button>
      </div>
    }
  </div>
  <button class="table__add" type="button" (click)="add.emit()">
    <tb-icon name="plus" />
    Добавить строку
  </button>
</div>
